    function getWibHour() {
        const now = new Date();
        return parseInt(now.toLocaleString("id-ID", { 
            timeZone: "Asia/Jakarta", 
            hour: "2-digit", 
            hour12: false 
        }));
    }

    function getWibDateString() {
        const now = new Date();
        const options = { timeZone: "Asia/Jakarta", year: 'numeric', month: '2-digit', day: '2-digit' };
        const parts = new Intl.DateTimeFormat('id-ID', options).formatToParts(now);
        const y = parts.find(p => p.type === 'year').value;
        const m = parts.find(p => p.type === 'month').value;
        const d = parts.find(p => p.type === 'day').value;
        return `${y}-${m}-${d}`;
    }

    function getWibTimeString() {
        const now = new Date();
        return now.toLocaleTimeString('id-ID', { 
            timeZone: "Asia/Jakarta", 
            hour: '2-digit', 
            minute: '2-digit', 
            hour12: false 
        });
    }

    function isMorningCutOffTime() {
        return getWibHour() >= 20;
    }

    function isAfternoonCutOffTime() {
        return getWibHour() >= 22;
    }

    function isWeekendToday() {
        const now = new Date();
        const dayStr = now.toLocaleDateString('en-US', { timeZone: 'Asia/Jakarta', weekday: 'short' });
        return dayStr === 'Sat' || dayStr === 'Sun';
    }

    function getMaxTitik1Slots() {
        return isWeekendToday() ? 3 : 2;
    }

    function formatRupiahInput(inputElement) {
        let val = inputElement.value.replace(/[^,\d]/g, '').toString();
        let split = val.split(',');
        let sisa = split[0].length % 3;
        let rupiah = split[0].substr(0, sisa);
        let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

        if (ribuan) {
            let separator = sisa ? '.' : '';
            rupiah += separator + ribuan.join('.');
        }

        rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
        inputElement.value = rupiah;
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderAppTemplate();
        updateAttendanceStats();

        if (globalTimerInterval) clearInterval(globalTimerInterval);
        globalTimerInterval = setInterval(() => {
            updateActiveSessionsTimersUI();
        }, 1000);

        db.ref('appState').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                const todayWib = getWibDateString();

                if (!val.date || val.date !== todayWib) {
                    currentSpots = [[null, null, null], [null, null], [null, null]];
                    activeQueue = [];
                    pausedQueue = [];
                    shiftMorningQueue = [];
                    shiftAfternoonQueue = [];
                    spotShiftOrigin = [[null, null, null], [null, null], [null, null]];
                    activeSessions = [];
                    activityLogs = [];

                    updateDisplay();
                    updateAttendanceStats();
                    renderLogs();
                    return;
                }

                if (val.currentSpots) {
                    currentSpots = Array.isArray(val.currentSpots) ? val.currentSpots.map(g => Array.isArray(g) ? g : Object.values(g)) : Object.values(val.currentSpots).map(g => Array.isArray(g) ? g : Object.values(g));
                }
                if (val.activeQueue) activeQueue = Array.isArray(val.activeQueue) ? val.activeQueue : Object.values(val.activeQueue);
                if (val.pausedQueue) pausedQueue = Array.isArray(val.pausedQueue) ? val.pausedQueue : Object.values(val.pausedQueue);
                if (val.shiftMorningQueue) shiftMorningQueue = Array.isArray(val.shiftMorningQueue) ? val.shiftMorningQueue : Object.values(val.shiftMorningQueue);
                
                // PERBAIKAN BUG TYPO DI SINI: Menggunakan val.shiftAfternoonQueue
                if (val.shiftAfternoonQueue) shiftAfternoonQueue = Array.isArray(val.shiftAfternoonQueue) ? val.shiftAfternoonQueue : Object.values(val.shiftAfternoonQueue);
                
                if (val.spotShiftOrigin) {
                    spotShiftOrigin = Array.isArray(val.spotShiftOrigin) ? val.spotShiftOrigin.map(g => Array.isArray(g) ? g : Object.values(g)) : Object.values(val.spotShiftOrigin).map(g => Array.isArray(g) ? g : Object.values(g));
                }
                if (val.activeSessions) activeSessions = Array.isArray(val.activeSessions) ? val.activeSessions : Object.values(val.activeSessions);
                if (val.activityLogs) activityLogs = Array.isArray(val.activityLogs) ? val.activityLogs : Object.values(val.activityLogs);

                updateDisplay();
                updateAttendanceStats();
                renderLogs();
            }
        });
    });

    function pushStateToFirebase() {
        db.ref('appState').set({
            date: getWibDateString(),
            currentSpots: currentSpots,
            activeQueue: activeQueue,
            pausedQueue: pausedQueue,
            shiftMorningQueue: shiftMorningQueue,
            shiftAfternoonQueue: shiftAfternoonQueue,
            spotShiftOrigin: spotShiftOrigin,
            activeSessions: activeSessions,
            activityLogs: activityLogs
        });
    }

    function getOrderedFlowSlots() {
        let slots = [];
        const limitSpot1 = getMaxTitik1Slots();

        for(let p = 0; p < limitSpot1; p++) {
            slots.push({ s: 0, p: p });
        }
        for(let p = 0; p < 2; p++) {
            slots.push({ s: 1, p: p });
        }
        for(let p = 0; p < 2; p++) {
            slots.push({ s: 2, p: p });
        }
        return slots;
    }

    function advanceRotationAndFill() {
        const slots = getOrderedFlowSlots();

        for (let i = 0; i < slots.length - 1; i++) {
            let curr = slots[i];
            let next = slots[i+1];
            if (!currentSpots[curr.s][curr.p] && currentSpots[next.s][next.p]) {
                currentSpots[curr.s][curr.p] = currentSpots[next.s][next.p];
                spotShiftOrigin[curr.s][curr.p] = spotShiftOrigin[next.s][next.p];

                currentSpots[next.s][next.p] = null;
                spotShiftOrigin[next.s][next.p] = null;
            }
        }

        for (let i = 0; i < slots.length; i++) {
            let slot = slots[i];
            if (!currentSpots[slot.s][slot.p] && activeQueue.length > 0) {
                let nextStaff = activeQueue.shift();
                currentSpots[slot.s][slot.p] = nextStaff;
                const isMorningStaff = shiftMorningQueue.some(emp => emp.nik === nextStaff.nik);
                spotShiftOrigin[slot.s][slot.p] = isMorningStaff ? 'pagi' : 'siang';
            }
        }
    }

    setInterval(() => {
        if (isMorningCutOffTime() && shiftMorningQueue.length > 0) {
            let stateChanged = false;
            const morningNiks = new Set(shiftMorningQueue.map(emp => emp.nik));

            shiftMorningQueue = [];
            stateChanged = true;

            const filteredActiveQueue = activeQueue.filter(staff => !morningNiks.has(staff.nik));
            if (filteredActiveQueue.length !== activeQueue.length) {
                activeQueue = filteredActiveQueue;
                stateChanged = true;
            }

            if (pausedQueue && pausedQueue.length > 0) {
                const filteredPausedQueue = pausedQueue.filter(item => !morningNiks.has(item.staff.nik));
                if (filteredPausedQueue.length !== pausedQueue.length) {
                    pausedQueue = filteredPausedQueue;
                    stateChanged = true;
                }
            }

            for (let s = 0; s < 3; s++) {
                let maxP = s === 0 ? getMaxTitik1Slots() : 2;
                let p = 0;
                while (p < maxP) {
                    let staff = currentSpots[s][p];
                    if (staff && (morningNiks.has(staff.nik) || spotShiftOrigin[s][p] === 'pagi')) {
                        currentSpots[s][p] = null;
                        spotShiftOrigin[s][p] = null;
                        stateChanged = true;
                    }
                    p++;
                }
            }

            if (stateChanged) {
                advanceRotationAndFill();
                pushStateToFirebase();
                updateDisplay();
                updateAttendanceStats();
                renderLogs();
            }
        }

        if (isAfternoonCutOffTime()) {
            let hasActiveData = shiftAfternoonQueue.length > 0 || shiftMorningQueue.length > 0 || activeQueue.length > 0 || pausedQueue.length > 0 || activeSessions.length > 0;
            shiftAfternoonQueue = [];
            shiftMorningQueue = [];
            activeQueue = [];
            pausedQueue = [];
            activeSessions = [];
            let stateChanged = hasActiveData;
            for(let s=0; s<3; s++) {
                if (currentSpots[s]) {
                    for(let p=0; p<currentSpots[s].length; p++) {
                        if(currentSpots[s][p] !== null) stateChanged = true;
                        currentSpots[s][p] = null;
                        spotShiftOrigin[s][p] = null;
                    }
                }
            }
            if(stateChanged) {
                pushStateToFirebase();
                updateDisplay();
                updateAttendanceStats();
                renderLogs();
            }
            return;
        }

        if (pausedQueue && pausedQueue.length > 0) {
            const currentTime = Date.now();
            let updatedPausedQueue = [];
            let stateChanged = false;

            pausedQueue.forEach(item => {
                if (currentTime >= item.resumeTime) {
                    activeQueue.push(item.staff);
                    stateChanged = true;
                } else {
                    updatedPausedQueue.push(item);
                }
            });

            if (stateChanged) {
                pausedQueue = updatedPausedQueue;
                advanceRotationAndFill();
                pushStateToFirebase();
                updateDisplay();
            }
        }
    }, 1000);

    function triggerNextGreeterNotification(staffName, spotName) {
        if (isAfternoonCutOffTime()) return;
        const modal = document.getElementById('notification-modal');
        const msg = document.getElementById('notification-message');
        if (modal && msg) {
            msg.innerText = `Petugas ${staffName} dipersilakan naik ke ${spotName}!`;
            modal.classList.remove('hidden');

            if ("vibrate" in navigator) {
                try { navigator.vibrate([300, 150, 300]); } catch (e) {}
            }

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }
    }

    function cancelActiveBuddySession(sessionId) {
        const sessIdx = activeSessions.findIndex(s => s.id === sessionId);
        if (sessIdx === -1) return;

        const sess = activeSessions.splice(sessIdx, 1)[0];
        localStorage.setItem('greeter_active_sessions', JSON.stringify(activeSessions));

        const staff = sess.staff;
        const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];
        const targetSpotIndex = Number(sess.spotIndex);
        const targetSpotPos = Number(sess.spotPositionIndex);

        const slots = getOrderedFlowSlots();
        let originalLinearIndex = slots.findIndex(sl => sl.s === targetSpotIndex && sl.p === targetSpotPos);

        let currentActiveStaffList = [];
        slots.forEach(sl => {
            if (currentSpots[sl.s] && currentSpots[sl.s][sl.p]) {
                currentActiveStaffList.push({
                    staff: currentSpots[sl.s][sl.p],
                    origin: spotShiftOrigin[sl.s][sl.p] || 'pagi'
                });
            }
        });

        const isMorningStaff = shiftMorningQueue.some(emp => emp.nik === staff.nik);
        const staffOrigin = isMorningStaff ? 'pagi' : 'siang';

        if (originalLinearIndex !== -1) {
            currentActiveStaffList = currentActiveStaffList.filter(item => item.staff.nik !== staff.nik);

            const insertIdx = Math.min(originalLinearIndex, currentActiveStaffList.length);
            currentActiveStaffList.splice(insertIdx, 0, { staff: staff, origin: staffOrigin });

            for (let s = 0; s < 3; s++) {
                if (currentSpots[s]) {
                    for (let p = 0; p < currentSpots[s].length; p++) {
                        currentSpots[s][p] = null;
                        spotShiftOrigin[s][p] = null;
                    }
                }
            }

            for (let i = 0; i < slots.length; i++) {
                if (i < currentActiveStaffList.length) {
                    const slotInfo = slots[i];
                    const activeInfo = currentActiveStaffList[i];
                    currentSpots[slotInfo.s][slotInfo.p] = activeInfo.staff;
                    spotShiftOrigin[slotInfo.s][slotInfo.p] = activeInfo.origin;
                }
            }

            for (let i = slots.length; i < currentActiveStaffList.length; i++) {
                activeQueue.unshift(currentActiveStaffList[i].staff);
            }
        } else {
            if (!isNaN(targetSpotIndex) && !isNaN(targetSpotPos) && currentSpots[targetSpotIndex]) {
                if (!currentSpots[targetSpotIndex][targetSpotPos]) {
                    currentSpots[targetSpotIndex][targetSpotPos] = staff;
                    spotShiftOrigin[targetSpotIndex][targetSpotPos] = staffOrigin;
                } else {
                    activeQueue.unshift(staff);
                    advanceRotationAndFill();
                }
            } else {
                activeQueue.unshift(staff);
                advanceRotationAndFill();
            }
        }

        const timeNow = getWibTimeString();
        const logData = {
            date: getWibDateString(),
            time: timeNow,
            staffName: staff.name,
            spot: spotNames[targetSpotIndex] || "Titik Greeter",
            shift: "CANCEL",
            duration: "00:00",
            reason: "BATAL [Customer Sudah Janjian] -> Kembali ke Titik Awal",
            photo: "Tanpa Foto",
            gps: "-"
        };

        activityLogs.unshift(logData);
        syncLogToSpreadsheet(logData);

        renderActiveSessionsList();
        renderLogs();
        updateDisplay();
        pushStateToFirebase();

        showCustomAlert('Sesi Dibatalkan', `Sesi ${staff.name} dibatalkan (customer sudah janjian) dan petugas dikembalikan ke titik asalnya.`);
    }

    function saveSmtList() {
        if (isAfternoonCutOffTime()) {
            closeSmtModal();
            showCustomAlert("Waktu Cut-Off Tercapai", "Pukul 22.00 WIB telah tercapai. Penambahan SMT dan rotasi dihentikan.");
            return;
        }

        const mode = document.querySelector('input[name="shift-mode"]:checked').value;
        if(mode === 'pagi') {
            if (isMorningCutOffTime()) {
                showCustomAlert("Waktu Cut-Off Shift Pagi", "Pukul 20.00 WIB telah tercapai. Shift Pagi tidak dapat diinput kembali.");
                return;
            }
            shiftMorningQueue = [...selectedStaffQueue];
        } else {
            shiftAfternoonQueue = [...selectedStaffQueue];
        }

        const combinedQueueMap = new Map();
        [...shiftMorningQueue, ...shiftAfternoonQueue].forEach(staff => {
            if (staff && staff.nik) combinedQueueMap.set(staff.nik, staff);
        });

        currentSpots.forEach(spotGroup => {
            if (spotGroup) {
                spotGroup.forEach(staff => {
                    if (staff && staff.nik) combinedQueueMap.delete(staff.nik);
                });
            }
        });

        if (pausedQueue && pausedQueue.length > 0) {
            pausedQueue.forEach(item => {
                if (item && item.staff && item.staff.nik) combinedQueueMap.delete(item.staff.nik);
            });
        }

        if (activeSessions && activeSessions.length > 0) {
            activeSessions.forEach(sess => {
                if (sess && sess.staff && sess.staff.nik) combinedQueueMap.delete(sess.staff.nik);
            });
        }

        activeQueue = Array.from(combinedQueueMap.values());

        advanceRotationAndFill();

        pushStateToFirebase();
        updateDisplay();
        updateAttendanceStats();
        closeSmtModal();
        showCustomAlert("Berhasil", `Data SMT Shift ${mode.toUpperCase()} berhasil disimpan dan disinkronkan ke dalam antrean.`);
    }

    function updateAttendanceStats() {
        const uniqueNik = new Set();

        function collectNiks(source) {
            if (!source) return;
            if (Array.isArray(source)) {
                source.forEach(s => { 
                    if (s) {
                        if (s.nik) uniqueNik.add(s.nik);
                        else if (s.staff && s.nik) uniqueNik.add(s.staff.nik);
                        else if (typeof s === 'object') {
                            Object.values(s).forEach(sub => { if (sub && sub.nik) uniqueNik.add(sub.nik); });
                        }
                    }
                });
            } else if (typeof source === 'object') {
                Object.values(source).forEach(s => { 
                    if (s) {
                        if (s.nik) uniqueNik.add(s.nik);
                        else if (s.staff && s.nik) uniqueNik.add(s.staff.nik);
                        else if (typeof s === 'object') {
                            Object.values(s).forEach(sub => { if (sub && sub.nik) uniqueNik.add(sub.nik); });
                        }
                    }
                });
            }
        }

        collectNiks(shiftMorningQueue);
        collectNiks(shiftAfternoonQueue);
        collectNiks(activeQueue);
        collectNiks(pausedQueue);
        collectNiks(activeSessions);
        collectNiks(currentSpots);

        const present = uniqueNik.size;
        const off = employees.length - present;
        const pEl = document.getElementById('stat-present');
        const oEl = document.getElementById('stat-off');
        if (pEl) pEl.innerText = present;
        if (oEl) oEl.innerText = off >= 0 ? off : employees.length;
    }

    function updateDisplay() {
        if (isAfternoonCutOffTime()) {
            for(let s=0; s<3; s++) {
                if (currentSpots[s]) {
                    for(let p=0; p<currentSpots[s].length; p++) {
                        currentSpots[s][p] = null;
                    }
                }
            }
        }

        const limitSpot1 = getMaxTitik1Slots();

        // Render Titik 1
        const el0 = document.getElementById('spot-0');
        if (el0) {
            let html0 = '';
            for(let i=0; i<limitSpot1; i++) {
                let staff = currentSpots[0] && currentSpots[0][i] ? currentSpots[0][i] : null;
                if(staff) {
                    html0 += `
                        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-2xs space-y-2">
                            <div class="flex justify-between items-center">
                                <strong class="text-slate-900 text-xs">${i+1}. ${staff.name}</strong>
                                <span class="text-[11px] font-mono text-slate-400 bg-slate-100 px-2 py-1 rounded-md">Aktif di Titik</span>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5 pt-1 border-t border-slate-100">
                                <button onclick="requestStaffPin('mulai', 0, ${i})" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 px-1 rounded-lg font-semibold transition cursor-pointer">🟢 Mulai Sesi</button>
                                <button onclick="requestStaffPin('skip', 0, ${i})" class="bg-amber-600 hover:bg-amber-700 text-white text-xs py-2 px-1 rounded-lg font-semibold transition cursor-pointer">⏭️ Skip</button>
                            </div>
                        </div>
                    `;
                }
            }
            const hasStaff0 = currentSpots[0] && currentSpots[0].some(s => s !== null);
            if(!hasStaff0) {
                html0 = `<p class="text-sm text-slate-400 italic">${isAfternoonCutOffTime() ? 'Selesai (Cut-off Jam 22:00 WIB)' : 'Belum ada petugas'}</p>`;
            }
            el0.innerHTML = html0;
        }

        // Render Titik 2 & Titik 3
        for (let i = 1; i < 3; i++) {
            const el = document.getElementById(`spot-${i}`);
            let htmlStr = '';
            let maxP = 2;

            for (let p = 0; p < maxP; p++) {
                let staff = currentSpots[i] && currentSpots[i][p] ? currentSpots[i][p] : null;
                if (staff) {
                    htmlStr += `
                        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-2xs space-y-2 mb-2">
                            <div class="flex justify-between items-center">
                                <strong class="text-slate-900 text-xs">${p+1}. ${staff.name}</strong>
                                <span class="text-[11px] font-mono text-slate-400 bg-slate-100 px-2 py-1 rounded-md">Aktif di Titik</span>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5 pt-1 border-t border-slate-100">
                                <button onclick="requestStaffPin('mulai', ${i}, ${p})" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 px-1 rounded-lg font-semibold transition cursor-pointer">🟢 Mulai Sesi</button>
                                <button onclick="requestStaffPin('skip', ${i}, ${p})" class="bg-amber-600 hover:bg-amber-700 text-white text-xs py-2 px-1 rounded-lg font-semibold transition cursor-pointer">⏭️ Skip</button>
                            </div>
                        </div>
                    `;
                }
            }

            const hasStaffI = currentSpots[i] && currentSpots[i].some(s => s !== null);
            if(!hasStaffI) {
                htmlStr = `<p class="text-sm text-slate-400 italic">${isAfternoonCutOffTime() ? 'Selesai (Cut-off Jam 22:00 WIB)' : 'Belum ada petugas'}</p>`;
            }

            if (el) el.innerHTML = htmlStr;
        }

        // Render Antrean Cadangan
        const qContainer = document.getElementById('queue-display');
        if (qContainer) {
            qContainer.innerHTML = '';
            if (activeQueue.length > 0) {
                activeQueue.forEach((r, idx) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between bg-white px-3.5 py-2.5 rounded-xl border border-slate-200/80 shadow-2xs';
                    row.innerHTML = `<span class="font-semibold text-slate-800 text-xs md:text-sm"><span class="text-blue-600 font-bold mr-2">${idx + 1}.</span>${r.name}</span><span class="text-xs text-slate-400 font-mono">NIK: ${r.nik}</span>`;
                    qContainer.appendChild(row);
                });
            } else {
                qContainer.innerHTML = `<div class="bg-white p-3 rounded-xl border border-slate-200 text-center"><span class="text-slate-400 italic text-xs">${isAfternoonCutOffTime() ? 'Selesai (Cut-off Jam 22:00 WIB)' : 'Tidak ada antrean cadangan'}</span></div>`;
            }
        }
        updateAttendanceStats();
    }

    function requestRotateVolleyball() {
        if (isAfternoonCutOffTime()) {
            showCustomAlert('Waktu Cut-Off', 'Pukul 22.00 WIB telah tercapai. Rotasi dihentikan.');
            return;
        }

        document.getElementById('rotasi-pin-input').value = '';
        document.getElementById('rotasi-pin-error').classList.add('hidden');
        document.getElementById('rotasi-step-pin').classList.remove('hidden');
        document.getElementById('rotasi-step-select').classList.add('hidden');
        document.getElementById('rotasi-pin-modal').classList.remove('hidden');
    }

    function closeRotasiPinModal() {
        document.getElementById('rotasi-pin-modal').classList.add('hidden');
    }

    function verifyRotasiPin() {
        if (document.getElementById('rotasi-pin-input').value === '15032024') {
            document.getElementById('rotasi-step-pin').classList.add('hidden');
            document.getElementById('rotasi-step-select').classList.remove('hidden');

            const selectEl = document.getElementById('rotasi-target-select');
            selectEl.innerHTML = '';

            if (activeQueue.length === 0) {
                selectEl.innerHTML = '<option value="">Tidak ada antrean cadangan</option>';
            } else {
                activeQueue.forEach((staff, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = `${staff.name} (NIK: ${staff.nik})`;
                    selectEl.appendChild(opt);
                });
            }
        } else {
            document.getElementById('rotasi-pin-error').classList.add('hidden');
        }
    }

    function executeManualRotation() {
        if (isAfternoonCutOffTime()) return;

        const selectEl = document.getElementById('rotasi-target-select');
        const chosenQueueIndex = parseInt(selectEl.value);

        if (isNaN(chosenQueueIndex) || activeQueue.length === 0) {
            closeRotasiPinModal();
            return;
        }

        const chosenStaff = activeQueue.splice(chosenQueueIndex, 1)[0];

        const slots = getOrderedFlowSlots();
        let firstSlot = slots[0];

        let displacedStaff = currentSpots[firstSlot.s][firstSlot.p];
        currentSpots[firstSlot.s][firstSlot.p] = chosenStaff;
        const isMorningStaff = shiftMorningQueue.some(emp => emp.nik === chosenStaff.nik);
        spotShiftOrigin[firstSlot.s][firstSlot.p] = isMorningStaff ? 'pagi' : 'siang';

        if (displacedStaff) {
            activeQueue.push(displacedStaff);
        }

        advanceRotationAndFill();

        if (chosenStaff) {
            triggerNextGreeterNotification(chosenStaff.name, "Main Entrance");
        }

        pushStateToFirebase();
        updateDisplay();
        closeRotasiPinModal();
        showCustomAlert('Berhasil', 'Rotasi manual berhasil dieksekusi.');
    }

    function startBuddySession(spotIndex, staffPositionIndex) {
        if (isAfternoonCutOffTime()) {
            showCustomAlert('Waktu Cut-Off', 'Pukul 22.00 WIB telah tercapai. Sesi baru tidak dapat dimulai.');
            return;
        }

        const staff = currentSpots[spotIndex][staffPositionIndex];
        if (!staff) return;

        const newSession = {
            id: 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
            spotIndex: Number(spotIndex),
            spotPositionIndex: Number(staffPositionIndex),
            staff: staff,
            startTime: Date.now()
        };

        activeSessions.push(newSession);
        localStorage.setItem('greeter_active_sessions', JSON.stringify(activeSessions));

        currentSpots[spotIndex][staffPositionIndex] = null;
        spotShiftOrigin[spotIndex][staffPositionIndex] = null;

        advanceRotationAndFill();

        pushStateToFirebase();
        updateDisplay();
        showCustomAlert('Sesi Dimulai', `Sesi buddy untuk ${staff.name} telah dimulai.`);
    }

    function openSkipModalDirect(spotIndex, staffPositionIndex) {
        skipSpotIndex = spotIndex;
        skipStaffIndexInSpot = staffPositionIndex;
        const staff = currentSpots[spotIndex][staffPositionIndex];
        const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];
        document.getElementById('skip-info-text').innerText = `Titik: ${spotNames[spotIndex]} (Petugas #${staffPositionIndex + 1}) | Petugas: ${staff.name}`;
        document.getElementById('skip-modal').classList.remove('hidden');
        document.getElementById('skip-reason-detail').value = '';
    }

    function closeSkipModal() {
        document.getElementById('skip-modal').classList.add('hidden');
    }

    function toggleSkipReasonInput() {
        const cont = document.getElementById('skip-reason-detail-container');
        if (cont) {
            cont.innerHTML = `<input type="text" id="skip-reason-detail" placeholder="Keterangan tambahan..." class="border border-slate-300 rounded-xl px-3.5 py-2.5 w-full text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 font-medium">`;
        }
    }

    function confirmSkipAction() {
        if (isAfternoonCutOffTime()) return;

        const staff = currentSpots[skipSpotIndex][skipStaffIndexInSpot];
        const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];
        const category = document.getElementById('skip-reason-category').value;
        const detailInput = document.getElementById('skip-reason-detail');
        const detail = detailInput ? detailInput.value : '-';
        const timeNow = getWibTimeString();

        let hoursToAdd = 0;
        if (category === '1_Jam') hoursToAdd = 1;
        else if (category === '2_Jam') hoursToAdd = 2;
        else if (category === '3_Jam') hoursToAdd = 3;

        if (hoursToAdd > 0) {
            const resumeTime = Date.now() + (hoursToAdd * 60 * 60 * 1000);
            pausedQueue.push({ staff: staff, resumeTime: resumeTime });

            const logData = {
                date: getWibDateString(),
                time: timeNow,
                staffName: staff.name,
                spot: spotNames[skipSpotIndex],
                shift: "SKIP IZIN",
                duration: `${hoursToAdd} Jam`,
                reason: `SKIP [Izin ${hoursToAdd} Jam]: ${detail}`,
                photo: "Tanpa Foto",
                gps: "-"
            };
            activityLogs.unshift(logData);
            syncLogToSpreadsheet(logData);
        } else {
            const logData = {
                date: getWibDateString(),
                time: timeNow,
                staffName: staff.name,
                spot: spotNames[skipSpotIndex],
                shift: "SKIP",
                duration: "00:00 (SKIP)",
                reason: `SKIP [${category}]: ${detail}`,
                photo: "Tanpa Foto",
                gps: "-"
            };
            activityLogs.unshift(logData);
            syncLogToSpreadsheet(logData);
            activeQueue.push(staff);
        }

        renderLogs();
        closeSkipModal();

        currentSpots[skipSpotIndex][skipStaffIndexInSpot] = null;
        spotShiftOrigin[skipSpotIndex][skipStaffIndexInSpot] = null;

        advanceRotationAndFill();

        pushStateToFirebase();
        updateDisplay();
        showCustomAlert('Berhasil Skip', `Petugas ${staff.name} berhasil di-skip ${hoursToAdd > 0 ? 'selama ' + hoursToAdd + ' jam (Keluar dari antrean sementara)' : 'dan ditaruh ke antrean paling bawah'}.`);
    }

    function syncLogToSpreadsheet(log) {
        if (!SCRIPT_URL) return;
        const payload = {
            timestamp: `${log.date} ${log.time}`,
            nama: log.staffName,
            point: log.spot,
            status: `Durasi: ${log.duration} | ${log.reason} | GPS: ${log.gps} | Foto: ${log.photo}`
        };
        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(err => console.error("Gagal sync sheet:", err));
    }

    function renderLogs() {
        const tbody = document.getElementById('log-table-body');
        if (!tbody) return;

        const todayStr = getWibDateString();
        const todayLogs = activityLogs.filter(l => l.date === todayStr);

        if (todayLogs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400 italic">Belum ada aktivitas tercatat hari ini.</td></tr>`;
            return;
        }
        tbody.innerHTML = '';
        todayLogs.forEach(log => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50/80 transition';
            tr.innerHTML = `
                <td class="p-3.5 font-mono text-xs">${log.time}</td>
                <td class="p-3.5 font-bold text-slate-900">${log.staffName}</td>
                <td class="p-3.5 font-medium">${log.spot}</td>
                <td class="p-3.5"><span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-lg font-bold">${log.shift}</span></td>
                <td class="p-3.5 font-mono font-medium">${log.duration}</td>
                <td class="p-3.5">${log.reason}</td>
                <td class="p-3.5"><span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-medium font-medium">${log.photo} | 📍 ${log.gps}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function fetchSpreadsheetLogs() {
        if (!SCRIPT_URL) return [];
        try {
            const response = await fetch(SCRIPT_URL);
            const result = await response.json();
            const rawData = Array.isArray(result) ? result : (result.data || []);

            return rawData.map((item, idx) => {
                let timestampStr = item.timestamp || "";
                let datePart = "";
                let timePart = "";

                if (timestampStr.includes(" ")) {
                    let parts = timestampStr.split(" ");
                    datePart = parts[0];
                    timePart = parts[1];
                } else {
                    datePart = timestampStr.substring(0, 10);
                    timePart = timestampStr.substring(11, 19);
                }

                return {
                    No: idx + 1,
                    date: datePart,
                    time: timePart,
                    staffName: item.nama || "",
                    spot: item.point || "",
                    shift: "AKTIF",
                    duration: "-",
                    reason: item.status || "",
                    gps: "-",
                    photo: "-"
                };
            });
        } catch (err) {
            console.error("Gagal mengambil data dari Spreadsheet:", err);
            return [];
        }
    }

    function filterLogsByPeriod(logs, period) {
        const todayStr = getWibDateString();
        if (period === 'daily') {
            return logs.filter(l => l.date === todayStr);
        } else if (period === 'weekly') {
            const d = new Date();
            d.setDate(d.getDate() - 7);
            return logs.filter(l => new Date(l.date) >= d);
        } else {
            return logs.filter(l => l.date.startsWith(todayStr.substring(0, 7)));
        }
    }

    async function exportExcel() {
        const period = document.getElementById('report-period').value;
        const allLogs = await fetchSpreadsheetLogs();

        if (allLogs.length === 0) {
            showCustomAlert('Perhatian', 'Tidak ada data rekap pada Spreadsheet.');
            return;
        }

        const filtered = filterLogsByPeriod(allLogs, period);

        if (filtered.length === 0) {
            showCustomAlert('Perhatian', 'Tidak ada data rekap pada periode ini.');
            return;
        }

        const dataToExport = filtered.map((l, idx) => ({
            No: idx + 1, 
            Tanggal: l.date, 
            Waktu: l.time, 
            Petugas: l.staffName, 
            Titik: l.spot, 
            "Detail / Status": l.reason
        }));

        const worksheet = XLSX.utils.json_to_sheet(dataToExport);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Buddy");
        XLSX.writeFile(workbook, `Rekap_Buddy_${period}.xlsx`);
        closeReportModal();
    }

    async function sendWhatsApp() {
        const period = document.getElementById('report-period').value;
        const allLogs = await fetchSpreadsheetLogs();

        if (allLogs.length === 0) {
            showCustomAlert('Perhatian', 'Tidak ada data rekap untuk dikirim.');
            return;
        }

        const filtered = filterLogsByPeriod(allLogs, period);

        if (filtered.length === 0) {
            showCustomAlert('Perhatian', 'Tidak ada data rekap untuk periode ini.');
            return;
        }

        let text = `📋 *REKAP SESI BUDDY & SMT* (${period.toUpperCase()})\n\n`;
        filtered.forEach((l, i) => {
            text += `${i+1}. [${l.date} ${l.time}] *${l.staffName}* di *${l.spot}*\n📝 ${l.reason}\n\n`;
        });

        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        closeReportModal();
    }
