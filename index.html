    function getWibCurrentTime() {
        try {
            const now = new Date();
            const options = { 
                timeZone: "Asia/Jakarta", 
                hour12: false, 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            const parts = formatter.formatToParts(now);
            let dateObj = {};
            parts.forEach(p => { if (p.type !== 'literal') dateObj[p.type] = p.value; });

            return {
                year: parseInt(dateObj.year, 10),
                month: parseInt(dateObj.month, 10),
                day: parseInt(dateObj.day, 10),
                hours: parseInt(dateObj.hour, 10),
                minutes: parseInt(dateObj.minute, 10),
                dateString: `${dateObj.year}-${dateObj.month}-${dateObj.day}`
            };
        } catch (e) {
            const fallback = new Date();
            return {
                hours: fallback.getHours(),
                minutes: fallback.getMinutes(),
                dateString: fallback.toISOString().split('T')[0]
            };
        }
    }

    function getWibHour() {
        return getWibCurrentTime().hours;
    }

    function getWibDateString() {
        return getWibCurrentTime().dateString;
    }

    function getWibTimeString() {
        const now = new Date();
        return now.toLocaleTimeString('id-ID', {

            hour: '2-digit', 
            minute: '2-digit', 
            hour12: false 
        });
    }

    function isMorningCutOffTime() {
        return getWibHour() >= 20;
    }

    function isAfternoonCutOffTime() {
        return getWibHour() >= 22;
    }

    function isWeekendToday() {
        const now = new Date();
        const dayStr = now.toLocaleDateString('en-US', { timeZone: 'Asia/Jakarta', weekday: 'short' });
        return dayStr === 'Sat' || dayStr === 'Sun';
    }

    function formatRupiahInput(inputElement) {
        let val = inputElement.value.replace(/[^,\d]/g, '').toString();
        let split = val.split(',');
        let sisa = split[0].length % 3;
        let rupiah = split[0].substr(0, sisa);
        let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

        if (ribuan) {
            let separator = sisa ? '.' : '';
            rupiah += separator + ribuan.join('.');
        }

        rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
        inputElement.value = rupiah;
    }

    function cleanupActiveQueue() {
        const activeNiks = new Set();
        currentSpots.forEach(group => {
            if (group) group.forEach(staff => { if (staff && staff.nik) activeNiks.add(staff.nik); });
        });
        activeSessions.forEach(sess => {
            if (sess && sess.staff && sess.staff.nik) activeNiks.add(sess.staff.nik);
        });
        pausedQueue.forEach(item => {
            if (item && item.staff && item.nik) activeNiks.add(item.staff.nik);
        });

        activeQueue = Array.isArray(activeQueue) ? activeQueue.filter(staff => staff && staff.nik && !activeNiks.has(staff.nik)) : [];
    }

    function sanitizeStateForTime() {
        let changed = false;
        const wibHour = getWibHour();

        if (wibHour >= 22) {
            if (activeQueue.length > 0) { activeQueue = []; changed = true; }
            currentSpots.forEach((group, s) => {
                if (group) {
                    group.forEach((staff, p) => {
                        if (staff) { currentSpots[s][p] = null; spotShiftOrigin[s][p] = null; changed = true; }
                    });
                }
            });
            return changed;
        }

        if (wibHour >= 20) {
            const activeBuddyNiks = new Set(activeSessions.map(s => s.staff && s.staff.nik).filter(Boolean));
            const morningNiks = new Set(Array.isArray(shiftMorningQueue) ? shiftMorningQueue.map(e => e.nik) : Object.values(shiftMorningQueue).map(e => e.nik));

            const initLen = activeQueue.length;
            activeQueue = Array.isArray(activeQueue) ? activeQueue.filter(staff => {
                if (!staff || !staff.nik) return false;
                const isMorning = morningNiks.has(staff.nik);
                const isBuddy = activeBuddyNiks.has(staff.nik);
                return !(isMorning && !isBuddy);
            }) : [];
            if (activeQueue.length !== initLen) changed = true;

            currentSpots.forEach((group, s) => {
                if (group) {
                    group.forEach((staff, p) => {
                        if (staff && staff.nik) {
                            const isMorning = morningNiks.has(staff.nik);
                            const isBuddy = activeBuddyNiks.has(staff.nik);
                            if (isMorning && !isBuddy) {
                                currentSpots[s][p] = null;
                                spotShiftOrigin[s][p] = null;
                                changed = true;
                            }
                        }
                    });
                }
            });
        }

        cleanupActiveQueue();
        return changed;
    }

                    ];

                    activeQueue = dataToUse.activeQueue ? (Array.isArray(dataToUse.activeQueue) ? dataToUse.activeQueue : Object.values(dataToUse.activeQueue)) : [];
                    pausedQueue = dataToUse.pausedQueue ? (Array.isArray(dataToUse.pausedQueue) ? dataToUse.pausedQueue : Object.values(dataToUse.pausedQueue)) : [];
                    shiftMorningQueue = dataToUse.shiftMorningQueue ? (Array.isArray(dataToUse.shiftMorningQueue) ? dataToUse.shiftMorningQueue : Object.values(dataToUse.shiftMorningQueue)) : [];
                    shiftAfternoonQueue = dataToUse.shiftAfternoonQueue ? (Array.isArray(dataToUse.shiftAfternoonQueue) ? dataToUse.shiftAfternoonQueue : Object.values(dataToUse.shiftAfternoonQueue)) : [];
                    
                    spotShiftOrigin = [

                    ];

    function pushStateToFirebase() {
        try {
            sanitizeStateForTime();
            cleanupActiveQueue();

            const plainSpots = currentSpots.map(group => group ? group.map(staff => staff ? {...staff} : null) : []);
            const plainOrigin = spotShiftOrigin.map(group => group ? group.map(org => org ? org : null) : []);

            const stateData = {
                date: getWibDateString(),
                currentSpots: plainSpots,
                activeQueue: Array.isArray(activeQueue) ? activeQueue : Object.values(activeQueue),
                pausedQueue: Array.isArray(pausedQueue) ? pausedQueue : Object.values(pausedQueue),
                shiftMorningQueue: Array.isArray(shiftMorningQueue) ? shiftMorningQueue : Object.values(shiftMorningQueue),
                shiftAfternoonQueue: Array.isArray(shiftAfternoonQueue) ? shiftAfternoonQueue : Object.values(shiftAfternoonQueue),
                spotShiftOrigin: plainOrigin,
                activeSessions: Array.isArray(activeSessions) ? activeSessions : Object.values(activeSessions),
                activityLogs: Array.isArray(activityLogs) ? activityLogs : Object.values(activityLogs)
            };

            localStorage.setItem('greeter_full_state_backup', JSON.stringify(stateData));

            db.ref('appState').set(stateData).catch(err => {
                console.error("Gagal simpan ke Firebase:", err);
            });
        } catch (e) {
            console.error("Error pushStateToFirebase:", e);
        }
    }

    function getOrderedFlowSlots() {
        let slots = [];
        const limitSpot1 = getMaxTitik1Slots();

        for(let p = 0; p < limitSpot1; p++) {
            slots.push({ s: 0, p: p });
        }
        for(let p = 0; p < 2; p++) {
            slots.push({ s: 1, p: p });
        }
        for(let p = 0; p < 2; p++) {
            slots.push({ s: 2, p: p });
        }
        return slots;
    }

    function advanceRotationAndFill() {
        sanitizeStateForTime();
        const slots = getOrderedFlowSlots();

        for (let i = 0; i < slots.length - 1; i++) {
            let curr = slots[i];
            let next = slots[i+1];
            if (!currentSpots[curr.s][curr.p] && currentSpots[next.s][next.p]) {
                currentSpots[curr.s][curr.p] = currentSpots[next.s][next.p];
                spotShiftOrigin[curr.s][curr.p] = spotShiftOrigin[next.s][next.p];

                currentSpots[next.s][next.p] = null;
                spotShiftOrigin[next.s][next.p] = null;
            }
        }

        for (let i = 0; i < slots.length; i++) {
            let slot = slots[i];
            if (!currentSpots[slot.s][slot.p] && activeQueue.length > 0) {
                cleanupActiveQueue();
                if (activeQueue.length > 0) {
                    let nextStaff = activeQueue.shift();
                    currentSpots[slot.s][slot.p] = nextStaff;
                    const morningList = Array.isArray(shiftMorningQueue) ? shiftMorningQueue : Object.values(shiftMorningQueue);
                    const isMorningStaff = morningList.some(emp => emp.nik === nextStaff.nik);
                    spotShiftOrigin[slot.s][slot.p] = isMorningStaff ? 'pagi' : 'siang';
                }
            }
        }
        cleanupActiveQueue();
    }

    setInterval(() => {
        try {
            if (pausedQueue && pausedQueue.length > 0) {
                const currentTime = Date.now();
                let updatedPausedQueue = [];
                let stateChanged = false;

                pausedQueue.forEach(item => {
                    if (currentTime >= item.resumeTime) {
                        activeQueue.push(item.staff);
                        stateChanged = true;
                    } else {
                        updatedPausedQueue.push(item);
                    }
                });

                if (stateChanged) {
                    pausedQueue = updatedPausedQueue;
                    advanceRotationAndFill();
                    pushStateToFirebase();
                    updateDisplay();
                }
            }
        } catch (e) {
            console.error("Error pausedQueue interval:", e);
        }
    }, 1000);

        if (modal && msg) {
            msg.innerText = `Petugas ${staffName} dipersilakan naik ke ${spotName}!`;
            modal.classList.remove('hidden');

            if ("vibrate" in navigator) {
                try { navigator.vibrate([300, 150, 300]); } catch (e) {}
            }

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }
    }

    function executeCancelBuddySession() {
        try {
            if (!pendingCancelSessionId) return;
            const sessionId = pendingCancelSessionId;
            closeCancelConfirmModal();

            const sessIdx = activeSessions.findIndex(s => s.id === sessionId);
            if (sessIdx === -1) return;

            const sess = activeSessions.splice(sessIdx, 1)[0];
            localStorage.setItem('greeter_active_sessions', JSON.stringify(activeSessions));

            const staff = sess.staff;
            const staffName = typeof staff === 'object' ? (staff.name || staff.nama || 'Petugas') : staff;
            const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];
            const targetSpotIndex = Number(sess.spotIndex);
            const targetSpotPos = Number(sess.spotPositionIndex);

            const slots = getOrderedFlowSlots();
            let originalLinearIndex = slots.findIndex(sl => sl.s === targetSpotIndex && sl.p === targetSpotPos);

            let currentActiveStaffList = [];
            slots.forEach(sl => {
                if (currentSpots[sl.s] && currentSpots[sl.s][sl.p]) {
                    currentActiveStaffList.push({
                        staff: currentSpots[sl.s][sl.p],
                        origin: spotShiftOrigin[sl.s][sl.p] || 'pagi'
                    });
                }
            });

            const morningArr = Array.isArray(shiftMorningQueue) ? shiftMorningQueue : Object.values(shiftMorningQueue);
            const isMorningStaff = morningArr.some(emp => emp.nik === staff.nik);
            const staffOrigin = isMorningStaff ? 'pagi' : 'siang';

            if (originalLinearIndex !== -1) {
                currentActiveStaffList = currentActiveStaffList.filter(item => item.staff.nik !== staff.nik);

                const insertIdx = Math.min(originalLinearIndex, currentActiveStaffList.length);
                currentActiveStaffList.splice(insertIdx, 0, { staff: staff, origin: staffOrigin });

                for (let s = 0; s < 3; s++) {
                    if (currentSpots[s]) {
                        for (let p = 0; p < currentSpots[s].length; p++) {
                            currentSpots[s][p] = null;
                            spotShiftOrigin[s][p] = null;
                        }
                    }
                }

                for (let i = 0; i < slots.length; i++) {
                    if (i < currentActiveStaffList.length) {
                        const slotInfo = slots[i];
                        const activeInfo = currentActiveStaffList[i];
                        currentSpots[slotInfo.s][slotInfo.p] = activeInfo.staff;
                        spotShiftOrigin[slotInfo.s][slotInfo.p] = activeInfo.origin;
                    }
                }

                for (let i = slots.length; i < currentActiveStaffList.length; i++) {
                    activeQueue.unshift(currentActiveStaffList[i].staff);
                }
            } else {
                activeQueue.unshift(staff);
                advanceRotationAndFill();
            }

            const timeNow = getWibTimeString();
            const logData = {
                date: getWibDateString(),
                time: timeNow,
                staffName: staffName,
                spot: spotNames[targetSpotIndex] || "Titik Greeter",
                shift: "CANCEL",
                duration: "00:00",
                reason: "BATAL [Customer Sudah Janjian] -> Kembali ke Titik Awal",
                photo: "Tanpa Foto",
                gps: "-"
            };

            activityLogs.unshift(logData);
            syncLogToSpreadsheet(logData);

            cleanupActiveQueue();
            renderActiveSessionsList();
            renderLogs();
            updateDisplay();
            pushStateToFirebase();

            showCustomAlert('Sesi Dibatalkan', `Sesi ${staffName} dibatalkan dan petugas dikembalikan ke titik asalnya.`);
        } catch (e) {
            console.error("Error executeCancelBuddySession:", e);
        }
    }

                spotPositionIndex: Number(staffPositionIndex),

                startTime: Date.now()
            };

            localStorage.setItem('greeter_active_sessions', JSON.stringify(activeSessions));

    function saveSmtList() {
        try {
            const saveBtn = document.getElementById('btn-save-smt');
            if (saveBtn) saveBtn.disabled = true;

            const mode = document.querySelector('input[name="shift-mode"]:checked').value;
            
            if (mode === 'pagi') {
                shiftMorningQueue = [...selectedStaffQueue];
            } else {
                shiftAfternoonQueue = [...selectedStaffQueue];
            }

            const existingNiks = new Set();
            currentSpots.forEach(group => {
                if (group) group.forEach(staff => { if (staff && staff.nik) existingNiks.add(staff.nik); });
            });
            activeSessions.forEach(sess => {
                if (sess && sess.staff && sess.staff.nik) existingNiks.add(sess.staff.nik);
            });
            pausedQueue.forEach(item => {
                if (item && item.staff && item.nik) existingNiks.add(item.staff.nik);
            });
            activeQueue.forEach(staff => {
                if (staff && staff.nik) existingNiks.add(staff.nik);
            });

            let addedCount = 0;
            selectedStaffQueue.forEach(staff => {
                if (staff && staff.nik && !existingNiks.has(staff.nik)) {
                    activeQueue.push(staff);
                    existingNiks.add(staff.nik);
                    addedCount++;
                }
            });

            sanitizeStateForTime();
            advanceRotationAndFill();
            cleanupActiveQueue();
            pushStateToFirebase();
            updateDisplay();
            updateAttendanceStats();
            closeSmtModal();
            if (saveBtn) saveBtn.disabled = false;
            showCustomAlert("Berhasil", `Data SMT Shift ${mode.toUpperCase()} berhasil disimpan. ${addedCount} petugas baru ditambahkan ke antrean paling bawah tanpa menimpa data yang sedang berjalan.`);
        } catch (e) {
            console.error("Error saveSmtList:", e);
        }
    }

    function updateAttendanceStats() {
        try {
            const uniqueNik = new Set();
            function collectNiks(source) {
                if (!source) return;
                const arr = Array.isArray(source) ? source : Object.values(source);
                arr.forEach(s => { 
                    if (s) {
                        if (s.nik) uniqueNik.add(s.nik);
                        else if (s.staff && s.nik) uniqueNik.add(s.staff.nik);
                        else if (typeof s === 'object') {
                            Object.values(s).forEach(sub => { if (sub && sub.nik) uniqueNik.add(sub.nik); });
                        }
                    }
                });
            }

            collectNiks(shiftMorningQueue);
            collectNiks(shiftAfternoonQueue);
            collectNiks(activeQueue);
            collectNiks(pausedQueue);
            collectNiks(activeSessions);
            collectNiks(currentSpots);

            const present = uniqueNik.size;
            const off = employees.length - present;
            const pEl = document.getElementById('stat-present');
            const oEl = document.getElementById('stat-off');
            if (pEl) pEl.innerText = present;
            if (oEl) oEl.innerText = off >= 0 ? off : employees.length;
        } catch (e) {
            console.error("Error updateAttendanceStats:", e);
        }
    }

    }

    function verifyRotasiPin() {
        if (document.getElementById('rotasi-pin-input').value === '11012023') {
            document.getElementById('rotasi-step-pin').classList.add('hidden');
            document.getElementById('rotasi-step-select').classList.remove('hidden');

            const selectEl = document.getElementById('rotasi-target-select');
            selectEl.innerHTML = '';

            let allAvailableStaff = [];
            
            sanitizeStateForTime();
            cleanupActiveQueue();
            
            const activeQueueArr = Array.isArray(activeQueue) ? activeQueue : Object.values(activeQueue);
            activeQueueArr.forEach((staff, idx) => {
                let staffName = typeof staff === 'object' ? (staff.name || staff.nama || 'Petugas') : staff;
                allAvailableStaff.push({
                    name: staffName,
                    nik: staff.nik,
                    source: 'queue',
                    index: idx,
                    label: `[Antrean Cadangan] ${staffName}`
                });
            });

            currentSpots.forEach((spotGroup, sIdx) => {
                const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];
                if (spotGroup) {
                    spotGroup.forEach((staff, pIdx) => {
                        if (staff) {
                            let staffName = typeof staff === 'object' ? (staff.name || staff.nama || 'Petugas') : staff;
                            allAvailableStaff.push({
                                name: staffName,
                                nik: staff.nik,
                                source: 'spot',
                                sIdx: sIdx,
                                pIdx: pIdx,
                                label: `[Aktif di ${spotNames[sIdx]}] ${staffName}`
                            });
                        }
                    });
                }
            });

            const pausedArr = Array.isArray(pausedQueue) ? pausedQueue : Object.values(pausedQueue);
            if (pausedArr && pausedArr.length > 0) {
                pausedArr.forEach((item, idx) => {
                    if (item && item.staff) {
                        let staffName = typeof item.staff === 'object' ? (item.staff.name || item.staff.nama || 'Petugas') : item.staff;
                        allAvailableStaff.push({
                            name: staffName,
                            nik: item.staff.nik,
                            source: 'paused',
                            index: idx,
                            label: `[Sedang di Luar / Izin] ${staffName}`
                        });
                    }
                });
            }

            if (allAvailableStaff.length === 0) {
                selectEl.innerHTML = '<option value="">Tidak ada petugas tersedia</option>';
            } else {
                allAvailableStaff.forEach((item) => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify(item);
                    opt.textContent = item.label;
                    selectEl.appendChild(opt);
                });
            }

            updateRotationPositionOptions();
        } else {
            document.getElementById('rotasi-pin-error').classList.remove('hidden');
        }
    }

    function updateRotationPositionOptions() {
        const spotSelectVal = document.getElementById('rotasi-spot-select').value;
        const posWrapper = document.getElementById('rotasi-position-wrapper');
        const posSelect = document.getElementById('rotasi-position-select');
        posSelect.innerHTML = '';

        if (spotSelectVal === 'delete') {
            if (posWrapper) posWrapper.style.display = 'none';
            return;
        } else {
            if (posWrapper) posWrapper.style.display = 'block';
        }

        if (spotSelectVal.startsWith('spot_')) {
            const sIdx = parseInt(spotSelectVal.replace('spot_', ''));
            const maxSlots = (sIdx === 0) ? getMaxTitik1Slots() : 2;
            const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];
            for (let p = 0; p < maxSlots; p++) {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = `Slot / Urutan ke-${p + 1} di ${spotNames[sIdx]}`;
                posSelect.appendChild(opt);
            }
        } else if (spotSelectVal === 'queue') {
            const queueLen = activeQueue.length;
            for (let i = 0; i <= queueLen; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i === 0 ? `Urutan ke-1 (Paling Atas Antrean Cadangan)` : `Urutan ke-${i + 1} di Antrean`;
                posSelect.appendChild(opt);
            }
            if (queueLen === 0) {
                const opt = document.createElement('option');
                opt.value = 0;
                opt.textContent = `Urutan ke-1 (Antrean Kosong)`;
                posSelect.appendChild(opt);
            }
        }
    }

    function executeManualRotationCustom() {
        try {
            const selectEl = document.getElementById('rotasi-target-select');
            const spotSelectEl = document.getElementById('rotasi-spot-select');
            const posSelectEl = document.getElementById('rotasi-position-select');
            
            if (!selectEl.value) {
                closeRotasiPinModal();
                return;
            }

            const chosenItem = JSON.parse(selectEl.value);
            const destinationType = spotSelectEl.value;
            const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];

            let staffObj = null;

            if (chosenItem.source === 'queue') {
                staffObj = activeQueue.splice(chosenItem.index, 1)[0];
            } else if (chosenItem.source === 'spot') {
                staffObj = currentSpots[chosenItem.sIdx][chosenItem.pIdx];
                currentSpots[chosenItem.sIdx][chosenItem.pIdx] = null;
                spotShiftOrigin[chosenItem.sIdx][chosenItem.pIdx] = null;
            } else if (chosenItem.source === 'paused') {
                staffObj = pausedQueue.splice(chosenItem.index, 1)[0].staff;
            }

            if (!staffObj) {
                closeRotasiPinModal();
                return;
            }

            const staffName = typeof staffObj === 'object' ? (staffObj.name || staffObj.nama || 'Petugas') : staffObj;
            
            if (destinationType === 'delete') {
                sanitizeStateForTime();
                advanceRotationAndFill();
                cleanupActiveQueue();
                pushStateToFirebase();
                updateDisplay();
                closeRotasiPinModal();
                showCustomAlert('Berhasil Dihapus', `Petugas ${staffName} berhasil dihapus/dikeluarkan dari perputaran sistem hari ini.`);
                return;
            }

            const targetPositionIndex = parseInt(posSelectEl.value);
            const morningArr = Array.isArray(shiftMorningQueue) ? shiftMorningQueue : Object.values(shiftMorningQueue);
            const isMorningStaff = morningArr.some(emp => emp.nik === staffObj.nik);
            const staffOrigin = isMorningStaff ? 'pagi' : 'siang';

            if (destinationType.startsWith('spot_')) {
                const targetSpotIndex = parseInt(destinationType.replace('spot_', ''));
                
                let existingStaff = currentSpots[targetSpotIndex][targetPositionIndex];
                currentSpots[targetSpotIndex][targetPositionIndex] = staffObj;
                spotShiftOrigin[targetSpotIndex][targetPositionIndex] = staffOrigin;

                if (existingStaff) {
                    activeQueue.unshift(existingStaff);
                }

                triggerNextGreeterNotification(staffName, spotNames[targetSpotIndex]);
                showCustomAlert('Berhasil', `Petugas ${staffName} berhasil ditempatkan di ${spotNames[targetSpotIndex]} (Urutan/Slot ke-${targetPositionIndex + 1}).`);
            } else if (destinationType === 'queue') {
                activeQueue.splice(targetPositionIndex, 0, staffObj);
                showCustomAlert('Berhasil', `Petugas ${staffName} berhasil dimasukkan ke Antrean Cadangan di urutan ke-${targetPositionIndex + 1}.`);
            }

            sanitizeStateForTime();
            advanceRotationAndFill();
            cleanupActiveQueue();
            pushStateToFirebase();
            updateDisplay();
            closeRotasiPinModal();
        } catch (e) {
            console.error("Error executeManualRotationCustom:", e);
        }
    }

    function openSkipModalDirect(spotIndex, staffPositionIndex) {
        skipSpotIndex = spotIndex;
        skipStaffIndexInSpot = staffPositionIndex;
        const staff = currentSpots[spotIndex][staffPositionIndex];
        const staffName = typeof staff === 'object' ? (staff.name || staff.nama || 'Petugas') : staff;
        const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];
        document.getElementById('skip-info-text').innerText = `Titik: ${spotNames[spotIndex]} | Petugas: ${staffName}`;
        document.getElementById('skip-modal').classList.remove('hidden');
        document.getElementById('skip-reason-detail').value = '';
    }

    function closeSkipModal() {
        document.getElementById('skip-modal').classList.add('hidden');
    }

    function toggleSkipReasonInput() {
        const cont = document.getElementById('skip-reason-detail-container');
        if (cont) {
            cont.innerHTML = `<input type="text" id="skip-reason-detail" placeholder="Keterangan tambahan..." class="border border-slate-300 rounded-xl px-3.5 py-2.5 w-full text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 font-medium">`;
        }
    }

    function confirmSkipAction() {
        try {
            const staff = currentSpots[skipSpotIndex] && currentSpots[skipSpotIndex][skipStaffIndexInSpot];
            if (!staff) {
                closeSkipModal();
                showCustomAlert('Informasi', 'Data petugas sudah kedaluwarsa. Silakan muat ulang.');
                updateDisplay();
                return;
            }

            const staffName = typeof staff === 'object' ? (staff.name || staff.nama || 'Petugas') : staff;
            const spotNames = ["Main Entrance", "CarPark / CP", "HomeGallery / HG"];
            const category = document.getElementById('skip-reason-category').value;
            const detailInput = document.getElementById('skip-reason-detail');
            const detail = detailInput ? detailInput.value : '-';
            const timeNow = getWibTimeString();

            let hoursToAdd = 0;
            if (category === '1_Jam') hoursToAdd = 1;
            else if (category === '2_Jam') hoursToAdd = 2;
            else if (category === '3_Jam') hoursToAdd = 3;

            if (hoursToAdd > 0) {
                const resumeTime = Date.now() + (hoursToAdd * 60 * 60 * 1000);
                pausedQueue.push({ staff: staff, resumeTime: resumeTime });

                const logData = {
                    date: getWibDateString(),
                    time: timeNow,
                    staffName: staffName,
                    spot: spotNames[skipSpotIndex],
                    shift: "SKIP IZIN",
                    duration: `${hoursToAdd} Jam`,
                    reason: `SKIP [Izin ${hoursToAdd} Jam]: ${detail}`,
                    photo: "Tanpa Foto",
                    gps: "-"
                };
                activityLogs.unshift(logData);
                syncLogToSpreadsheet(logData);
            } else {
                const logData = {
                    date: getWibDateString(),
                    time: timeNow,
                    staffName: staffName,
                    spot: spotNames[skipSpotIndex],
                    shift: "SKIP",
                    duration: "00:00 (SKIP)",
                    reason: `SKIP [${category}]: ${detail}`,
                    photo: "Tanpa Foto",
                    gps: "-"
                };
                activityLogs.unshift(logData);
                syncLogToSpreadsheet(logData);
                
                activeQueue.push(staff);
            }

            renderLogs();
            closeSkipModal();

            currentSpots[skipSpotIndex][skipStaffIndexInSpot] = null;
            spotShiftOrigin[skipSpotIndex][skipStaffIndexInSpot] = null;

            sanitizeStateForTime();
            advanceRotationAndFill();
            cleanupActiveQueue();
            pushStateToFirebase();
            updateDisplay();
            showCustomAlert('Berhasil Skip', `Petugas ${staffName} berhasil di-skip dan turun ke antrean bawah.`);
        } catch (e) {
            console.error("Error confirmSkipAction:", e);
        }
    }

    function syncLogToSpreadsheet(log) {
        if (!SCRIPT_URL) return;
        const payload = {
            timestamp: `${log.date} ${log.time}`,
            nama: log.staffName,
            point: log.spot,
            status: `Durasi: ${log.duration} | ${log.reason} | GPS: ${log.gps} | Foto: ${log.photo}`
        };
        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(err => console.error("Gagal sync sheet:", err));
    }

    function renderLogs() {
        const tbody = document.getElementById('log-table-body');
        if (!tbody) return;

        const todayStr = getWibDateString();
        const logsArr = Array.isArray(activityLogs) ? activityLogs : Object.values(activityLogs);
        const todayLogs = logsArr.filter(l => l && l.date === todayStr);

        if (todayLogs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400 italic">Belum ada aktivitas tercatat hari ini.</td></tr>`;
            return;
        }
        tbody.innerHTML = '';
        todayLogs.forEach(log => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50/80 transition';
            tr.innerHTML = `
                <td class="p-3.5 font-mono text-xs">${log.time}</td>
                <td class="p-3.5 font-bold text-slate-900">${log.staffName}</td>
                <td class="p-3.5 font-medium">${log.spot}</td>
                <td class="p-3.5"><span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-lg font-bold">${log.shift}</span></td>
                <td class="p-3.5 font-mono font-medium">${log.duration}</td>
                <td class="p-3.5">${log.reason}</td>
                <td class="p-3.5"><span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-medium font-medium">${log.photo} | 📍 ${log.gps}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function fetchSpreadsheetLogs() {
        if (!SCRIPT_URL) return [];
        try {
            const response = await fetch(SCRIPT_URL);
            const result = await response.json();
            const rawData = Array.isArray(result) ? result : (result.data || []);

            return rawData.map((item, idx) => {
                let timestampStr = item.timestamp || "";
                let datePart = "";
                let timePart = "";

                if (timestampStr.includes(" ")) {
                    let parts = timestampStr.split(" ");
                    datePart = parts[0];
                    timePart = parts[1];
                } else {
                    datePart = timestampStr.substring(0, 10);
                    timePart = timestampStr.substring(11, 19);
                }

                return {
                    No: idx + 1,
                    date: datePart,
                    time: timePart,
                    staffName: item.nama || "",
                    spot: item.point || "",
                    shift: "AKTIF",
                    duration: "-",
                    reason: item.status || "",
                    gps: "-",
                    photo: "-"
                };
            });
        } catch (err) {
            console.error("Gagal mengambil data dari Spreadsheet:", err);
            return [];
        }
    }

    function filterLogsByPeriod(logs, period) {
        const todayStr = getWibDateString();
        if (period === 'daily') {
            return logs.filter(l => l.date === todayStr);
        } else if (period === 'weekly') {
            const d = new Date();
            d.setDate(d.getDate() - 7);
            return logs.filter(l => new Date(l.date) >= d);
        } else {
            return logs.filter(l => l.date.startsWith(todayStr.substring(0, 7)));
        }
    }

    async function exportExcel() {
        const period = document.getElementById('report-period').value;
        const allLogs = await fetchSpreadsheetLogs();

        if (allLogs.length === 0) {
            showCustomAlert('Perhatian', 'Tidak ada data rekap pada Spreadsheet.');
            return;
        }

        const filtered = filterLogsByPeriod(allLogs, period);
        if (filtered.length === 0) {
            showCustomAlert('Perhatian', 'Tidak ada data rekap pada periode ini.');
            return;
        }

        const dataToExport = filtered.map((l, idx) => ({
            No: idx + 1, 
            Tanggal: l.date, 
            Waktu: l.time, 
            Petugas: l.staffName, 
            Titik: l.spot, 
            "Detail / Status": l.reason
        }));

        const worksheet = XLSX.utils.json_to_sheet(dataToExport);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Buddy");
        XLSX.writeFile(workbook, `Rekap_Buddy_${period}.xlsx`);
        closeReportModal();
    }

    async function sendWhatsApp() {
        const period = document.getElementById('report-period').value;
        const allLogs = await fetchSpreadsheetLogs();

        if (allLogs.length === 0) {
            showCustomAlert('Perhatian', 'Tidak ada data rekap untuk dikirim.');
            return;
        }

        const filtered = filterLogsByPeriod(allLogs, period);
        if (filtered.length === 0) {
            showCustomAlert('Perhatian', 'Tidak ada data rekap untuk periode ini.');
            return;
        }

        let text = `📋 *REKAP SESI BUDDY & SMT* (${period.toUpperCase()})\n\n`;
        filtered.forEach((l, i) => {
            text += `${i+1}. [${l.date} ${l.time}] *${l.staffName}* di *${l.spot}*\n📝 ${l.reason}\n\n`;
        });

        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        closeReportModal();
    }
